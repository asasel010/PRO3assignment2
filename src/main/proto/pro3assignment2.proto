syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.pro3assignment2.grpc";
option java_outer_classname = "Pro3assignment2Proto";

service TextConverter {
  rpc toUpper(RequestText) returns (ResponseText);
  rpc capitalizeFirstCharacter(RequestText) returns (ResponseText);
}

message RequestText{
  string input_text = 1;
}

message ResponseText{
  string output_text = 1;
}